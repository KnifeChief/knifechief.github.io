<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween - Escape</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/yazi.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
        }

        .oyun-kapsayici {
            position: relative;
            width: 800px;
            max-width: 95vw;
            height: 500px;
            background: #111;
            border: 2px solid #FFD700;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            overflow: hidden;
        }

        /* --- ARAYÜZ (UI) --- */
        .ui-ekran {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .gizli { display: none !important; }

        .oyun-baslik {
            color: #FFD700;
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            text-align: center;
        }

        .menu-btn {
            width: 250px;
            padding: 15px;
            background-color: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .menu-btn:hover {
            background-color: #FFD700;
            color: #111;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .yildiz-kutusu {
            font-size: 3rem;
            letter-spacing: 10px;
            margin-bottom: 20px;
            color: #444; /* Pasif yıldız rengi */
        }
        
        .sari-yildiz {
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        /* --- CANVAS --- */
        #oyunCanvas {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: block;
        }

        .oyun-hud {
            position: absolute;
            top: 15px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <ul class="arkaplan-daireleri">
        <li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="oyun-kapsayici">
        
        <div class="oyun-hud gizli" id="oyun-hud">
            <span id="seviye-metni">Bölüm: 1</span>
            <span id="kabak-metni">🎃 0/3</span>
        </div>

        <canvas id="oyunCanvas" width="800" height="500"></canvas>

        <!-- ANA MENÜ -->
        <div class="ui-ekran" id="ana-menu">
            <h1 class="oyun-baslik">🎃 PUMPKIN ESCAPE 🎃</h1>
            <p style="color:#aaa; margin-bottom: 30px;">Yeşil küpü WASD ile hareket ettir. Hayaletlere değme!</p>
            <button class="menu-btn" id="btn-oyna">Oyuna Başla</button>
        </div>

        <!-- ÖLDÜN EKRANI -->
        <div class="ui-ekran gizli" id="olum-menu">
            <h1 class="oyun-baslik" style="color: #ff3333; text-shadow: 0 0 15px red;">ÖLDÜN!</h1>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">Hayalete yakalandın veya tuzağa düştün.</p>
            <button class="menu-btn" id="btn-tekrar-dene">Tekrar Dene</button>
            <button class="menu-btn" id="btn-ana-menu">Ana Menü</button>
        </div>

        <!-- BÖLÜM GEÇİLDİ EKRANI -->
        <div class="ui-ekran gizli" id="zafer-menu">
            <h1 class="oyun-baslik" style="color: #00ff00;">BÖLÜM TAMAMLANDI</h1>
            <div class="yildiz-kutusu" id="yildiz-gosterge">★ ★ ★</div>
            <button class="menu-btn" id="btn-siradaki-bolum">Sıradaki Bölüm</button>
        </div>

    </div>

    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => document.getElementById('navbar-placeholder').innerHTML = data);

        const canvas = document.getElementById('oyunCanvas');
        const ctx = canvas.getContext('2d');

        // Arayüz Elementleri
        const anaMenu = document.getElementById('ana-menu');
        const olumMenu = document.getElementById('olum-menu');
        const zaferMenu = document.getElementById('zafer-menu');
        const oyunHud = document.getElementById('oyun-hud');
        
        const seviyeMetni = document.getElementById('seviye-metni');
        const kabakMetni = document.getElementById('kabak-metni');
        const yildizGosterge = document.getElementById('yildiz-gosterge');

        let mevcutBolumIndeksi = 0;
        let toplananKabak = 0;
        let oyunAktif = false;
        let animasyonID;

        // Kontroller
        const tuslar = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => { if (e.key.toLowerCase() in tuslar) tuslar[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { if (e.key.toLowerCase() in tuslar) tuslar[e.key.toLowerCase()] = false; });

        // Oyuncu Objesi
        const oyuncu = { x: 0, y: 0, boyut: 20, hiz: 4, renk: '#00ff00' };

        // Aktif Bölüm Verileri (Geçici Hafıza)
        let aktifDuvarlar = [];
        let aktifDusmanlar = [];
        let aktifKabaklar = [];
        let aktifBitis = {};

        // --- BÖLÜM TASARIMLARI (Level Design) ---
        const bolumler = [
            {
                baslangic: { x: 50, y: 50 },
                bitis: { x: 700, y: 400, w: 50, h: 50 },
                duvarlar: [
                    { x: 150, y: 0, w: 40, h: 300 },
                    { x: 350, y: 200, w: 40, h: 300 },
                    { x: 550, y: 0, w: 40, h: 350 }
                ],
                dusmanlar: [
                    // Y ekseninde (aşağı yukarı) devriye atan düşman
                    { x: 250, y: 50, boyut: 24, hizX: 0, hizY: 3, sinirMinY: 50, sinirMaxY: 400 }
                ],
                kabaklar: [
                    { x: 250, y: 420 },
                    { x: 450, y: 50 },
                    { x: 650, y: 420 }
                ]
            },
            // 2. BÖLÜM (Daha zor)
            {
                baslangic: { x: 50, y: 400 },
                bitis: { x: 700, y: 50, w: 50, h: 50 },
                duvarlar: [
                    { x: 120, y: 150, w: 600, h: 40 },
                    { x: 120, y: 300, w: 600, h: 40 }
                ],
                dusmanlar: [
                    // X ekseninde (sağa sola) devriye atan düşmanlar
                    { x: 150, y: 220, boyut: 24, hizX: 4, hizY: 0, sinirMinX: 150, sinirMaxX: 650 },
                    { x: 650, y: 380, boyut: 24, hizX: -5, hizY: 0, sinirMinX: 150, sinirMaxX: 650 }
                ],
                kabaklar: [
                    { x: 50, y: 50 },
                    { x: 380, y: 230 },
                    { x: 700, y: 400 }
                ]
            }
        ];

        // BUTON OLAYLARI
        document.getElementById('btn-oyna').addEventListener('click', () => bolumuYukle(0));
        document.getElementById('btn-tekrar-dene').addEventListener('click', () => bolumuYukle(mevcutBolumIndeksi));
        document.getElementById('btn-siradaki-bolum').addEventListener('click', () => {
            mevcutBolumIndeksi++;
            if(mevcutBolumIndeksi >= bolumler.length) mevcutBolumIndeksi = 0; // Oyun bittiyse başa dön
            bolumuYukle(mevcutBolumIndeksi);
        });
        document.getElementById('btn-ana-menu').addEventListener('click', () => {
            olumMenu.classList.add('gizli');
            anaMenu.classList.remove('gizli');
        });

        // BÖLÜMÜ BAŞLATMA FONKSİYONU
        function bolumuYukle(indeks) {
            mevcutBolumIndeksi = indeks;
            let veri = bolumler[indeks];

            // Oyuncuyu başlangıca koy
            oyuncu.x = veri.baslangic.x;
            oyuncu.y = veri.baslangic.y;

            // Bölüm verilerini aktif hafızaya kopyala (Klonlama)
            aktifDuvarlar = JSON.parse(JSON.stringify(veri.duvarlar));
            aktifDusmanlar = JSON.parse(JSON.stringify(veri.dusmanlar));
            aktifKabaklar = JSON.parse(JSON.stringify(veri.kabaklar));
            aktifBitis = JSON.parse(JSON.stringify(veri.bitis));

            toplananKabak = 0;
            oyunAktif = true;

            // Arayüzü Güncelle
            seviyeMetni.textContent = `Bölüm: ${mevcutBolumIndeksi + 1}`;
            kabakMetni.textContent = `🎃 ${toplananKabak}/3`;
            
            anaMenu.classList.add('gizli');
            olumMenu.classList.add('gizli');
            zaferMenu.classList.add('gizli');
            oyunHud.classList.remove('gizli');

            oyunDongusu();
        }

        // ÇARPIŞMA (AABB - Kutu Çarpışması)
        function kutuCarpisiyorMu(x1, y1, w1, h1, x2, y2, w2, h2) {
            return (x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2);
        }

        // DUVAR VE SINIR KONTROLÜ
        function duvaraCarpiyorMu(hedefX, hedefY) {
            if (hedefX < 0 || hedefX + oyuncu.boyut > canvas.width || hedefY < 0 || hedefY + oyuncu.boyut > canvas.height) return true;
            for (let d of aktifDuvarlar) {
                if (kutuCarpisiyorMu(hedefX, hedefY, oyuncu.boyut, oyuncu.boyut, d.x, d.y, d.w, d.h)) return true;
            }
            return false;
        }

        function olumTetikle() {
            oyunAktif = false;
            cancelAnimationFrame(animasyonID);
            oyunHud.classList.add('gizli');
            olumMenu.classList.remove('gizli');
        }

        function zaferTetikle() {
            oyunAktif = false;
            cancelAnimationFrame(animasyonID);
            
            // Yıldızları Hesapla
            let yildizHTML = "";
            for(let i=0; i<3; i++) {
                if(i < toplananKabak) yildizHTML += `<span class="sari-yildiz">★</span> `;
                else yildizHTML += `<span>★</span> `;
            }
            yildizGosterge.innerHTML = yildizHTML;

            oyunHud.classList.add('gizli');
            zaferMenu.classList.remove('gizli');
        }

        // ANA OYUN DÖNGÜSÜ (Update & Draw)
        function oyunDongusu() {
            if (!oyunAktif) return;

            // 1. OYUNCU HAREKETİ (X ve Y eksenini ayrı hesaplıyoruz ki duvarlarda kayabilsin)
            let yeniX = oyuncu.x;
            let yeniY = oyuncu.y;

            if (tuslar.w) yeniY -= oyuncu.hiz;
            if (tuslar.s) yeniY += oyuncu.hiz;
            if (tuslar.a) yeniX -= oyuncu.hiz;
            if (tuslar.d) yeniX += oyuncu.hiz;

            if (!duvaraCarpiyorMu(yeniX, oyuncu.y)) oyuncu.x = yeniX;
            if (!duvaraCarpiyorMu(oyuncu.x, yeniY)) oyuncu.y = yeniY;

            // 2. DÜŞMAN (HAYALET) HAREKETİ VE ÇARPIŞMASI
            for (let dusman of aktifDusmanlar) {
                dusman.x += dusman.hizX;
                dusman.y += dusman.hizY;

                // Devriye Sınırlarını Kontrol Et (Ping-Pong hareketi)
                if(dusman.hizX !== 0) {
                    if (dusman.x < dusman.sinirMinX || dusman.x > dusman.sinirMaxX) dusman.hizX *= -1;
                }
                if(dusman.hizY !== 0) {
                    if (dusman.y < dusman.sinirMinY || dusman.y > dusman.sinirMaxY) dusman.hizY *= -1;
                }

                // Düşmana Değdik mi?
                if (kutuCarpisiyorMu(oyuncu.x, oyuncu.y, oyuncu.boyut, oyuncu.boyut, dusman.x, dusman.y, dusman.boyut, dusman.boyut)) {
                    olumTetikle();
                    return; // Döngüyü anında kes
                }
            }

            // 3. BALKABAĞI TOPLAMA
            for (let i = aktifKabaklar.length - 1; i >= 0; i--) {
                let k = aktifKabaklar[i];
                if (kutuCarpisiyorMu(oyuncu.x, oyuncu.y, oyuncu.boyut, oyuncu.boyut, k.x - 10, k.y - 10, 30, 30)) {
                    aktifKabaklar.splice(i, 1); // Kabağı sil
                    toplananKabak++;
                    kabakMetni.textContent = `🎃 ${toplananKabak}/3`;
                }
            }

            // 4. BİTİŞ PORTALINA ULAŞMA
            if (kutuCarpisiyorMu(oyuncu.x, oyuncu.y, oyuncu.boyut, oyuncu.boyut, aktifBitis.x, aktifBitis.y, aktifBitis.w, aktifBitis.h)) {
                zaferTetikle();
                return;
            }

            // --- ÇİZİM (DRAW) ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zemin Süslemesi
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // Bitiş Portalı Çiz
            ctx.fillStyle = 'rgba(0, 255, 255, 0.3)'; // Açık mavi portal
            ctx.fillRect(aktifBitis.x, aktifBitis.y, aktifBitis.w, aktifBitis.h);
            ctx.strokeStyle = 'cyan';
            ctx.strokeRect(aktifBitis.x, aktifBitis.y, aktifBitis.w, aktifBitis.h);

            // Duvarları Çiz
            ctx.fillStyle = '#FFD700';
            ctx.shadowColor = 'rgba(255, 215, 0, 0.4)';
            ctx.shadowBlur = 10;
            for (let d of aktifDuvarlar) ctx.fillRect(d.x, d.y, d.w, d.h);
            ctx.shadowBlur = 0;

            // Balkabaklarını Çiz
            ctx.font = '24px Arial';
            for (let k of aktifKabaklar) ctx.fillText('🎃', k.x, k.y);

            // Düşmanları Çiz (Hayaletler)
            ctx.font = '24px Arial';
            for (let d of aktifDusmanlar) ctx.fillText('👻', d.x, d.y + 20);

            // Oyuncuyu Çiz (Yeşil Küp)
            ctx.fillStyle = oyuncu.renk;
            ctx.shadowColor = '#00ff00';
            ctx.shadowBlur = 15;
            ctx.fillRect(oyuncu.x, oyuncu.y, oyuncu.boyut, oyuncu.boyut);
            ctx.shadowBlur = 0;

            animasyonID = requestAnimationFrame(oyunDongusu);
        }
    </script>
</body>
</html>
