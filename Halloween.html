<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween - Escape</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/yazi.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            color: white;
        }

        .oyun-kapsayici {
            position: relative;
            width: 800px;
            max-width: 95vw;
            height: 500px;
            background: #111;
            border: 2px solid #FFD700;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            overflow: hidden;
        }

        /* --- ARAYÜZ (UI) --- */
        .ui-ekran {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .gizli { display: none !important; }

        .oyun-baslik {
            color: #FFD700;
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            text-align: center;
        }

        .menu-btn {
            width: 250px;
            padding: 15px;
            background-color: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .menu-btn:hover {
            background-color: #FFD700;
            color: #111;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        /* BÖLÜM AĞACI (LEVEL SELECT) */
        .level-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .level-btn {
            width: 60px;
            height: 60px;
            background-color: #222;
            color: #FFD700;
            border: 2px solid #FFD700;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .level-btn:hover {
            background-color: #FFD700;
            color: #111;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            transform: scale(1.1);
        }

        .yildiz-kutusu {
            font-size: 3rem;
            letter-spacing: 10px;
            margin-bottom: 20px;
            color: #444; 
        }
        
        .sari-yildiz {
            color: #FFD700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        /* --- CANVAS --- */
        #oyunCanvas {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: block;
        }

        .oyun-hud {
            position: absolute;
            top: 15px; left: 20px; right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            z-index: 5;
            pointer-events: none;
        }

        /* Kapı Açıldı Uyarısı */
        .kapi-uyari {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff00;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 6;
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <ul class="arkaplan-daireleri">
        <li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="oyun-kapsayici">
        
        <div class="oyun-hud gizli" id="oyun-hud">
            <span id="seviye-metni">Bölüm: 1</span>
            <span id="kabak-metni">🎃 0/3</span>
        </div>
        
        <div class="kapi-uyari" id="kapi-uyari">KAPI AÇILDI!</div>

        <canvas id="oyunCanvas" width="800" height="500"></canvas>

        <!-- ANA MENÜ -->
        <div class="ui-ekran" id="ana-menu">
            <h1 class="oyun-baslik">🎃 PUMPKIN ESCAPE 🎃</h1>
            <p style="color:#aaa; margin-bottom: 30px;">WASD ile hareket et. 3 Kabağı topla, kapıyı aç ve hayaletlerden kaç!</p>
            <button class="menu-btn" id="btn-oyna">Oyuna Başla</button>
            <button class="menu-btn" id="btn-bolumler">Bölümler</button>
        </div>

        <!-- BÖLÜM AĞACI -->
        <div class="ui-ekran gizli" id="bolum-agaci-menu">
            <h1 class="oyun-baslik">BÖLÜM SEÇİMİ</h1>
            <div class="level-grid" id="level-container">
                <!-- Javascript ile 10 buton buraya eklenecek -->
            </div>
            <button class="menu-btn" id="btn-agac-geri">Geri Dön</button>
        </div>

        <!-- ÖLDÜN EKRANI -->
        <div class="ui-ekran gizli" id="olum-menu">
            <h1 class="oyun-baslik" style="color: #ff3333; text-shadow: 0 0 15px red;">ÖLDÜN!</h1>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">Ruhun karanlığa karıştı...</p>
            <button class="menu-btn" id="btn-tekrar-dene">Tekrar Dene</button>
            <button class="menu-btn" id="btn-ana-menu">Ana Menü</button>
        </div>

        <!-- BÖLÜM GEÇİLDİ EKRANI -->
        <div class="ui-ekran gizli" id="zafer-menu">
            <h1 class="oyun-baslik" style="color: #00ff00;">BÖLÜM TAMAMLANDI</h1>
            <div class="yildiz-kutusu" id="yildiz-gosterge">★ ★ ★</div>
            <button class="menu-btn" id="btn-siradaki-bolum">Sıradaki Bölüm</button>
            <button class="menu-btn" id="btn-ana-menu-zafer">Ana Menü</button>
        </div>

    </div>

    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => document.getElementById('navbar-placeholder').innerHTML = data);

        const canvas = document.getElementById('oyunCanvas');
        const ctx = canvas.getContext('2d');

        // Arayüz Elementleri
        const anaMenu = document.getElementById('ana-menu');
        const bolumAgaciMenu = document.getElementById('bolum-agaci-menu');
        const olumMenu = document.getElementById('olum-menu');
        const zaferMenu = document.getElementById('zafer-menu');
        const oyunHud = document.getElementById('oyun-hud');
        
        const seviyeMetni = document.getElementById('seviye-metni');
        const kabakMetni = document.getElementById('kabak-metni');
        const yildizGosterge = document.getElementById('yildiz-gosterge');
        const kapiUyari = document.getElementById('kapi-uyari');

        let mevcutBolumIndeksi = 0;
        let toplananKabak = 0;
        let oyunAktif = false;
        let kapiAcik = false;
        let animasyonID;

        // Kontroller
        const tuslar = { w: false, a: false, s: false, d: false };
        window.addEventListener('keydown', e => { if (e.key.toLowerCase() in tuslar) tuslar[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { if (e.key.toLowerCase() in tuslar) tuslar[e.key.toLowerCase()] = false; });

        const oyuncu = { x: 0, y: 0, boyut: 20, hiz: 4, renk: '#00ff00' };

        // Aktif Bölüm Verileri
        let aktifDuvarlar = [];
        let aktifDusmanlar = [];
        let aktifKabaklar = [];
        let aktifBitis = {};
        let aktifKapi = {};

        // --- 10 BÖLÜM TASARIMI (DÜZELTİLMİŞ KOORDİNATLAR) ---
        const bolumler = [
            // Level 1: Öğretici
            { baslangic: { x: 50, y: 220 }, bitis: { x: 700, y: 200, w: 50, h: 50 },
              kapi: { x: 700, y: 200, w: 50, h: 50 }, // Tam olarak portalın üstünde
              duvarlar: [ { x: 150, y: 0, w: 40, h: 350 }, { x: 400, y: 150, w: 40, h: 350 } ],
              dusmanlar: [],
              kabaklar: [ { x: 100, y: 50 }, { x: 300, y: 400 }, { x: 500, y: 50 } ]
            },
            // Level 2: İlk Tehlike
            { baslangic: { x: 50, y: 50 }, bitis: { x: 700, y: 400, w: 50, h: 50 },
              kapi: { x: 700, y: 400, w: 50, h: 50 },
              duvarlar: [ { x: 200, y: 0, w: 40, h: 300 }, { x: 450, y: 200, w: 40, h: 300 } ],
              dusmanlar: [ { x: 300, y: 100, boyut: 24, hizX: 0, hizY: 4, sinirMinY: 50, sinirMaxY: 400 } ],
              kabaklar: [ { x: 250, y: 400 }, { x: 500, y: 100 }, { x: 750, y: 50 } ]
            },
            // Level 3: Devriye Düşmanlar
            { baslangic: { x: 50, y: 400 }, bitis: { x: 700, y: 50, w: 50, h: 50 },
              kapi: { x: 700, y: 50, w: 50, h: 50 },
              duvarlar: [ { x: 120, y: 150, w: 600, h: 40 }, { x: 120, y: 300, w: 600, h: 40 } ],
              dusmanlar: [ 
                  { x: 150, y: 220, boyut: 24, hizX: 5, hizY: 0, sinirMinX: 150, sinirMaxX: 650 },
                  { x: 650, y: 380, boyut: 24, hizX: -5, hizY: 0, sinirMinX: 150, sinirMaxX: 650 } 
              ],
              kabaklar: [ { x: 50, y: 50 }, { x: 380, y: 230 }, { x: 700, y: 400 } ]
            },
            // Level 4: Dar Koridorlar
            { baslangic: { x: 50, y: 50 }, bitis: { x: 350, y: 200, w: 50, h: 50 },
              kapi: { x: 350, y: 200, w: 50, h: 50 },
              duvarlar: [ { x: 0, y: 150, w: 300, h: 20 }, { x: 450, y: 150, w: 350, h: 20 }, { x: 300, y: 300, w: 200, h: 20 } ],
              dusmanlar: [ 
                  { x: 350, y: 50, boyut: 24, hizX: 0, hizY: 6, sinirMinY: 20, sinirMaxY: 130 },
                  { x: 350, y: 350, boyut: 24, hizX: 6, hizY: 0, sinirMinX: 100, sinirMaxX: 600 }
              ],
              kabaklar: [ { x: 700, y: 50 }, { x: 50, y: 400 }, { x: 700, y: 400 } ]
            },
           // Level 5: Ölümcül Spiral
            { baslangic: { x: 50, y: 50 }, bitis: { x: 380, y: 250, w: 50, h: 50 },
              kapi: { x: 380, y: 250, w: 50, h: 50 },
              duvarlar: [ 
                  { x: 150, y: 150, w: 500, h: 20 }, // Üst duvar
                  { x: 150, y: 150, w: 20, h: 200 }, // Sol duvar
                  { x: 150, y: 350, w: 500, h: 20 }, // Alt duvar
                  { x: 630, y: 220, w: 20, h: 150 }  // Sağ iç kilit duvarı
              ],
              dusmanlar: [
                  { x: 250, y: 200, boyut: 24, hizX: 5, hizY: 0, sinirMinX: 200, sinirMaxX: 600 },
                  { x: 400, y: 300, boyut: 24, hizX: -6, hizY: 0, sinirMinX: 200, sinirMaxX: 600 }
              ],
              kabaklar: [ { x: 700, y: 50 }, { x: 700, y: 400 }, { x: 200, y: 250 } ]
            },
            // Level 6: Çapraz Çılgınlık
            { baslangic: { x: 50, y: 400 }, bitis: { x: 700, y: 50, w: 50, h: 50 },
              kapi: { x: 700, y: 50, w: 50, h: 50 },
              duvarlar: [ { x: 200, y: 100, w: 20, h: 300 }, { x: 400, y: 100, w: 20, h: 300 } ],
              dusmanlar: [
                  { x: 100, y: 100, boyut: 24, hizX: 7, hizY: 7, sinirMinX: 0, sinirMaxX: 800, sinirMinY: 0, sinirMaxY: 500 },
                  { x: 700, y: 400, boyut: 24, hizX: -7, hizY: -7, sinirMinX: 0, sinirMaxX: 800, sinirMinY: 0, sinirMaxY: 500 }
              ],
              kabaklar: [ { x: 300, y: 250 }, { x: 500, y: 250 }, { x: 50, y: 50 } ]
            },
            // Level 7: Zikzak Zindanı
            { baslangic: { x: 50, y: 50 }, bitis: { x: 50, y: 400, w: 50, h: 50 },
              kapi: { x: 50, y: 400, w: 50, h: 50 },
              duvarlar: [ { x: 150, y: 0, w: 20, h: 400 }, { x: 300, y: 100, w: 20, h: 400 }, { x: 450, y: 0, w: 20, h: 400 }, { x: 600, y: 100, w: 20, h: 400 } ],
              dusmanlar: [
                  { x: 200, y: 250, boyut: 24, hizX: 0, hizY: 8, sinirMinY: 0, sinirMaxY: 500 },
                  { x: 500, y: 250, boyut: 24, hizX: 0, hizY: -8, sinirMinY: 0, sinirMaxY: 500 }
              ],
              kabaklar: [ { x: 225, y: 50 }, { x: 375, y: 450 }, { x: 700, y: 50 } ]
            },
            // Level 8: Çapraz Ateş
            { baslangic: { x: 50, y: 50 }, bitis: { x: 700, y: 400, w: 50, h: 50 },
              kapi: { x: 700, y: 400, w: 50, h: 50 },
              duvarlar: [ 
                  { x: 200, y: 0, w: 40, h: 150 }, 
                  { x: 200, y: 350, w: 40, h: 150 },
                  { x: 500, y: 0, w: 40, h: 150 },
                  { x: 500, y: 350, w: 40, h: 150 },
                  { x: 300, y: 230, w: 200, h: 40 } // Ortadaki güvenli ada
              ], 
              dusmanlar: [
                  { x: 100, y: 250, boyut: 24, hizX: 12, hizY: 0, sinirMinX: 0, sinirMaxX: 800 }, // Çok hızlı yatay kesici
                  { x: 350, y: 50, boyut: 24, hizX: 0, hizY: 9, sinirMinY: 0, sinirMaxY: 500 },  // Dikey 1
                  { x: 450, y: 450, boyut: 24, hizX: 0, hizY: -9, sinirMinY: 0, sinirMaxY: 500 } // Dikey 2
              ],
              kabaklar: [ { x: 50, y: 400 }, { x: 380, y: 50 }, { x: 700, y: 50 } ]
            },
            // Level 9: Keskin Nişancı
            { baslangic: { x: 50, y: 250 }, bitis: { x: 700, y: 250, w: 50, h: 50 },
              kapi: { x: 700, y: 250, w: 50, h: 50 },
              duvarlar: [ { x: 200, y: 0, w: 400, h: 180 }, { x: 200, y: 320, w: 400, h: 180 } ],
              dusmanlar: [
                  { x: 250, y: 240, boyut: 24, hizX: 18, hizY: 0, sinirMinX: 200, sinirMaxX: 600 } 
              ],
              kabaklar: [ { x: 100, y: 50 }, { x: 100, y: 450 }, { x: 750, y: 450 } ]
            },
            // Level 10: Cehennem
            { baslangic: { x: 50, y: 50 }, bitis: { x: 375, y: 225, w: 50, h: 50 },
              kapi: { x: 375, y: 225, w: 50, h: 50 },
              duvarlar: [ { x: 150, y: 150, w: 500, h: 20 }, { x: 150, y: 330, w: 500, h: 20 } ],
              dusmanlar: [
                  { x: 0, y: 100, boyut: 24, hizX: 10, hizY: 0, sinirMinX: 0, sinirMaxX: 800 },
                  { x: 800, y: 200, boyut: 24, hizX: -11, hizY: 0, sinirMinX: 0, sinirMaxX: 800 },
                  { x: 0, y: 300, boyut: 24, hizX: 12, hizY: 0, sinirMinX: 0, sinirMaxX: 800 },
                  { x: 800, y: 400, boyut: 24, hizX: -13, hizY: 0, sinirMinX: 0, sinirMaxX: 800 }
              ],
              kabaklar: [ { x: 750, y: 50 }, { x: 50, y: 450 }, { x: 750, y: 450 } ]
            }
        ];
        const levelContainer = document.getElementById('level-container');
        for (let i = 0; i < bolumler.length; i++) {
            const btn = document.createElement('button');
            btn.classList.add('level-btn');
            btn.textContent = i + 1;
            btn.addEventListener('click', () => bolumuYukle(i));
            levelContainer.appendChild(btn);
        }

        // MENÜ BUTON OLAYLARI
        document.getElementById('btn-oyna').addEventListener('click', () => bolumuYukle(0)); // Sıfırdan başla
        document.getElementById('btn-bolumler').addEventListener('click', () => {
            anaMenu.classList.add('gizli');
            bolumAgaciMenu.classList.remove('gizli');
        });
        document.getElementById('btn-agac-geri').addEventListener('click', () => {
            bolumAgaciMenu.classList.add('gizli');
            anaMenu.classList.remove('gizli');
        });
        document.getElementById('btn-tekrar-dene').addEventListener('click', () => bolumuYukle(mevcutBolumIndeksi));
        document.getElementById('btn-siradaki-bolum').addEventListener('click', () => {
            mevcutBolumIndeksi++;
            if(mevcutBolumIndeksi >= bolumler.length) mevcutBolumIndeksi = 0; // Oyun bittiyse başa dön
            bolumuYukle(mevcutBolumIndeksi);
        });
        document.getElementById('btn-ana-menu').addEventListener('click', () => { olumMenu.classList.add('gizli'); anaMenu.classList.remove('gizli'); });
        document.getElementById('btn-ana-menu-zafer').addEventListener('click', () => { zaferMenu.classList.add('gizli'); anaMenu.classList.remove('gizli'); });


        // BÖLÜMÜ YÜKLE
        function bolumuYukle(indeks) {
            mevcutBolumIndeksi = indeks;
            let veri = bolumler[indeks];

            oyuncu.x = veri.baslangic.x;
            oyuncu.y = veri.baslangic.y;

            aktifDuvarlar = JSON.parse(JSON.stringify(veri.duvarlar));
            aktifDusmanlar = JSON.parse(JSON.stringify(veri.dusmanlar));
            aktifKabaklar = JSON.parse(JSON.stringify(veri.kabaklar));
            aktifBitis = JSON.parse(JSON.stringify(veri.bitis));
            aktifKapi = JSON.parse(JSON.stringify(veri.kapi));

            toplananKabak = 0;
            oyunAktif = true;
            kapiAcik = false; // Kapı başta kapalı
            kapiUyari.style.opacity = '0';

            seviyeMetni.textContent = `Bölüm: ${mevcutBolumIndeksi + 1}`;
            kabakMetni.textContent = `🎃 0/3`;
            
            anaMenu.classList.add('gizli');
            bolumAgaciMenu.classList.add('gizli');
            olumMenu.classList.add('gizli');
            zaferMenu.classList.add('gizli');
            oyunHud.classList.remove('gizli');

            oyunDongusu();
        }

        // ÇARPIŞMA (AABB - Kutu Çarpışması)
        function kutuCarpisiyorMu(x1, y1, w1, h1, x2, y2, w2, h2) {
            return (x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2);
        }

        // DUVAR VE KAPI KONTROLÜ
        function duvaraCarpiyorMu(hedefX, hedefY) {
            // Harita sınırları
            if (hedefX < 0 || hedefX + oyuncu.boyut > canvas.width || hedefY < 0 || hedefY + oyuncu.boyut > canvas.height) return true;
            // Duvarlar
            for (let d of aktifDuvarlar) {
                if (kutuCarpisiyorMu(hedefX, hedefY, oyuncu.boyut, oyuncu.boyut, d.x, d.y, d.w, d.h)) return true;
            }
            // Kapı (Eğer kilitliyse bir duvar gibi davranır)
            if (!kapiAcik) {
                if (kutuCarpisiyorMu(hedefX, hedefY, oyuncu.boyut, oyuncu.boyut, aktifKapi.x, aktifKapi.y, aktifKapi.w, aktifKapi.h)) return true;
            }
            return false;
        }

        function olumTetikle() {
            oyunAktif = false;
            cancelAnimationFrame(animasyonID);
            oyunHud.classList.add('gizli');
            olumMenu.classList.remove('gizli');
        }

        function zaferTetikle() {
            oyunAktif = false;
            cancelAnimationFrame(animasyonID);
            
            let yildizHTML = "";
            for(let i=0; i<3; i++) {
                if(i < toplananKabak) yildizHTML += `<span class="sari-yildiz">★</span> `;
                else yildizHTML += `<span>★</span> `;
            }
            yildizGosterge.innerHTML = yildizHTML;

            oyunHud.classList.add('gizli');
            zaferMenu.classList.remove('gizli');
        }

        // ANA OYUN DÖNGÜSÜ
        function oyunDongusu() {
            if (!oyunAktif) return;

            // 1. OYUNCU HAREKETİ
            let yeniX = oyuncu.x;
            let yeniY = oyuncu.y;

            if (tuslar.w) yeniY -= oyuncu.hiz;
            if (tuslar.s) yeniY += oyuncu.hiz;
            if (tuslar.a) yeniX -= oyuncu.hiz;
            if (tuslar.d) yeniX += oyuncu.hiz;

            if (!duvaraCarpiyorMu(yeniX, oyuncu.y)) oyuncu.x = yeniX;
            if (!duvaraCarpiyorMu(oyuncu.x, yeniY)) oyuncu.y = yeniY;

            // 2. HAYALET HAREKETİ
            for (let dusman of aktifDusmanlar) {
                // Çapraz hareket de edebilmeleri için x ve y hızlarını aynı anda uyguluyoruz
                dusman.x += dusman.hizX;
                dusman.y += dusman.hizY;

                if(dusman.hizX !== 0) {
                    if (dusman.x < dusman.sinirMinX || dusman.x > dusman.sinirMaxX) dusman.hizX *= -1;
                }
                if(dusman.hizY !== 0) {
                    if (dusman.y < dusman.sinirMinY || dusman.y > dusman.sinirMaxY) dusman.hizY *= -1;
                }

                if (kutuCarpisiyorMu(oyuncu.x, oyuncu.y, oyuncu.boyut, oyuncu.boyut, dusman.x, dusman.y, dusman.boyut, dusman.boyut)) {
                    olumTetikle();
                    return; 
                }
            }

            // 3. BALKABAĞI TOPLAMA
            for (let i = aktifKabaklar.length - 1; i >= 0; i--) {
                let k = aktifKabaklar[i];
                if (kutuCarpisiyorMu(oyuncu.x, oyuncu.y, oyuncu.boyut, oyuncu.boyut, k.x - 10, k.y - 10, 30, 30)) {
                    aktifKabaklar.splice(i, 1);
                    toplananKabak++;
                    kabakMetni.textContent = `🎃 ${toplananKabak}/3`;

                    // 3 Kabak da toplandıysa KAPIYI AÇ
                    if(toplananKabak === 3) {
                        kapiAcik = true;
                        kapiUyari.style.opacity = '1';
                        setTimeout(() => kapiUyari.style.opacity = '0', 2000); // 2 saniye sonra yazıyı gizle
                    }
                }
            }

            // 4. BİTİŞ (Eğer Kapı Açıldıysa ve Portala Girdiyse)
            if (kutuCarpisiyorMu(oyuncu.x, oyuncu.y, oyuncu.boyut, oyuncu.boyut, aktifBitis.x, aktifBitis.y, aktifBitis.w, aktifBitis.h)) {
                if(kapiAcik) {
                    zaferTetikle();
                    return;
                }
            }

            // --- ÇİZİM ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Zemin Zindan Çizgileri
            ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // Bitiş Portalı
            ctx.fillStyle = kapiAcik ? 'rgba(0, 255, 255, 0.4)' : 'rgba(100, 100, 100, 0.2)'; 
            ctx.fillRect(aktifBitis.x, aktifBitis.y, aktifBitis.w, aktifBitis.h);
            ctx.strokeStyle = kapiAcik ? 'cyan' : '#444';
            ctx.strokeRect(aktifBitis.x, aktifBitis.y, aktifBitis.w, aktifBitis.h);

            // Kapı Çizimi (Eğer kilitliyse kırmızı ve parlayan bir enerji duvarı)
            if(!kapiAcik) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.shadowColor = 'red';
                ctx.shadowBlur = 15;
                ctx.fillRect(aktifKapi.x, aktifKapi.y, aktifKapi.w, aktifKapi.h);
                ctx.shadowBlur = 0;
                
                // Kapı çizgileri
                ctx.strokeStyle = '#ff3333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(aktifKapi.x, aktifKapi.y); ctx.lineTo(aktifKapi.x + aktifKapi.w, aktifKapi.y + aktifKapi.h);
                ctx.moveTo(aktifKapi.x + aktifKapi.w, aktifKapi.y); ctx.lineTo(aktifKapi.x, aktifKapi.y + aktifKapi.h);
                ctx.stroke();
            }

            // Duvarlar
            ctx.fillStyle = '#FFD700';
            ctx.shadowColor = 'rgba(255, 215, 0, 0.4)';
            ctx.shadowBlur = 10;
            for (let d of aktifDuvarlar) ctx.fillRect(d.x, d.y, d.w, d.h);
            ctx.shadowBlur = 0;

            // Kabaklar
            ctx.font = '24px Arial';
            for (let k of aktifKabaklar) ctx.fillText('🎃', k.x, k.y);

            // Hayaletler
            ctx.font = '24px Arial';
            for (let d of aktifDusmanlar) ctx.fillText('👻', d.x, d.y + 20);

            // Oyuncu Küpü
            ctx.fillStyle = oyuncu.renk;
            ctx.shadowColor = '#00ff00';
            ctx.shadowBlur = 15;
            ctx.fillRect(oyuncu.x, oyuncu.y, oyuncu.boyut, oyuncu.boyut);
            ctx.shadowBlur = 0;

            animasyonID = requestAnimationFrame(oyunDongusu);
        }
    </script>
