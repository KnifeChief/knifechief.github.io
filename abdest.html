<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kedi Abdest</title>
   
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    
    <link rel="stylesheet" href="css/yazi.css">

    
    <div id="sifre-modal" class="modal-arkaplan" style="display: none;">
        <div class="modal-kutu">
            <h3>YÖNETİCİ GİRİŞİ</h3>
            <p>Lütfen admin şifresini girin:</p>
            <input type="password" id="admin-sifre-input" placeholder="Şifre...">
            <div id="hata-mesaji" class="hata-text" style="display: none;">Hatalı şifre!</div>
            <div class="modal-butonlar">
                <button id="giris-yap-btn">Giriş Yap</button>
                <button id="kapat-btn">İptal</button>
            </div>
        </div>
    </div>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        
        .kedi-cercevesi {
            position: relative;
            
            width: clamp(200px, min(52vw, calc(100svh - 304px)), 400px);
            height: auto;
            aspect-ratio: 1;
            container-type: inline-size;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 4px solid #333;
            transition: all 0.4s ease;
        }

        
        .kedi-cercevesi.basarili {
            border-color: #00ff00;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.3);
        }

        .kedi-foto {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: top; 
            transition: opacity 0.3s ease;
        }

        .sayac-metni {
            position: fixed;
            bottom: 28px;
            left: 50%;
            z-index: 10;
            transform: translateX(-50%);
            color: #FFD700;
            font-size: 1.25rem;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        @media screen and (max-width: 900px) {
            .yan-kedi-kapsayici {
                width: clamp(90px, 20vw, 160px);
                height: clamp(90px, 20vw, 160px);
            }
            .sol-kedi { left: 3%; }
            .sag-kedi { right: 3%; }
        }

        @media screen and (max-width: 600px) {
            .yan-kedi-kapsayici {
                width: 72px;
                height: 72px;
            }
            .sayac-metni { bottom: 18px; }
        }

        
        @media screen and (max-width: 1100px) {
            .kedi-cercevesi {
                width: clamp(200px, min(44vw, calc(100svh - 304px)), 340px);
            }

            .yan-kedi-kapsayici {
                width: clamp(90px, 14vw, 120px);
                height: clamp(90px, 14vw, 120px);
            }

            .sol-kedi { left: 4%; }
            .sag-kedi { right: 4%; }
        }

        @media screen and (max-width: 600px) {
            .yan-kedi-kapsayici {
                width: 72px;
                height: 72px;
            }
            .sol-kedi { left: 3%; }
            .sag-kedi { right: 3%; }
        }

        
        .aksiyon-yazisi {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1); 
            font-size: 2rem; 
            font-weight: 700;
            color: white;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            text-align: center;
            width: 100%;
            max-width: 100%;
            padding: 0 12px;
            box-sizing: border-box;
            user-select: none;
            
           
            text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.9), -3px -3px 15px rgba(0, 0, 0, 0.9);
            transition: color 0.2s ease;
        }

        
        @container (max-width: 330px) {
            .aksiyon-yazisi {
                font-size: 1.35rem;
                letter-spacing: 2px;
            }
        }

        @container (max-width: 240px) {
            .aksiyon-yazisi {
                font-size: 0.95rem;
                letter-spacing: 1px;
            }
        }

        
        .aksiyon-yazisi:hover:not(.kucul-yok-ol):not(.buyu-yerine-gec) {
            color: #FFD700;
            transform: translate(-50%, -50%) scale(1.1);
        }

        
        .kucul-yok-ol {
            animation: kuculYokOl 0.4s forwards;
            pointer-events: none; 
        }

        @keyframes kuculYokOl {
            0% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        
        .buyu-yerine-gec {
            
            animation: buyuGel 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #00ff00;
            pointer-events: none;
        }

        @keyframes buyuGel {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* Senin eklediğin başlık */
        .abdest-baslik {
            top: 112px;
            left: 50%;
            transform: translateX(-50%);
            position: absolute;
            color: #FFD700;
            width: min(calc(100% - 40px), 720px);
            margin: 0;
            text-align: center;
            line-height: 1.3;
            font-size: clamp(1rem, 3.2vw, 2rem);
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
            transition: opacity 0.3s ease; /* Kaybolurken yumuşak gitsin */
            z-index: 10;
        }

        
        
        .baslik-kucul {
            animation: baslikKuculYokOl 0.4s forwards;
            pointer-events: none;
        }

        @keyframes baslikKuculYokOl {
            0% { transform: translateX(-50%) scale(1); opacity: 1; }
            100% { transform: translateX(-50%) scale(0); opacity: 0; }
        }

        .baslik-buyu {
            /* Yay gibi esneyerek gelir */
            animation: baslikBuyuGel 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #00ff00; /* Büyüdüğünde bunun da rengi yeşil olsun istersen */
            pointer-events: none;
        }

        @keyframes baslikBuyuGel {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        
    </style>
</head>
<body>
    
    
    <audio id="abdest-muzik" src="muzik/ilahi.mp3"></audio>

    <div id="navbar-placeholder"></div>

    <ul class="arkaplan-daireleri">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <div>
        <h2 class="abdest-baslik" id="istekli">Cenabet gibisin! Abdest Almak için tıklamak ister misin?</h2>
    </div>

    <div class="kedi-cercevesi" id="cerceve">
        
        <img src="img/cat.png" alt="Kedi" class="kedi-foto" id="kedi-resmi">
        
        
        <div class="aksiyon-yazisi" id="abdest-buton">ABDEST AL</div>
    </div>

        <div id="sayac" class="sayac-metni">05:00</div>

        <!-- SOL YAN KEDİ -->
    <div class="yan-kedi-kapsayici sol-kedi" id="sol-kedi">
        <div class="yan-kedi-govde">
            
            <img src="img/muslimcat2.jpeg" alt="Sol Kedi">
        </div>
    </div>

    <!-- SAĞ YAN KEDİ -->
    <div class="yan-kedi-kapsayici sag-kedi" id="sag-kedi">
        <div class="yan-kedi-govde">
            
            <img src="img/welldonecat.jpeg" alt="Sağ Kedi">
        </div>
    </div>



    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const kediResmi = document.getElementById('kedi-resmi');
            const abdestButon = document.getElementById('abdest-buton');
            const cerceve = document.getElementById('cerceve');
            const istekli = document.getElementById('istekli');
            const sayac = document.getElementById('sayac');
            
            
            const abdestMuzik = document.getElementById('abdest-muzik');
            
            let islemTamam = false; 
            let sayacAraligi;
            const SURE_SANIYE = 5 * 60;

            function sayaciGuncelle(kalanSaniye) {
                const dakika = String(Math.floor(kalanSaniye / 60)).padStart(2, '0');
                const saniye = String(kalanSaniye % 60).padStart(2, '0');
                sayac.textContent = `${dakika}:${saniye}`;
            }

            function sayaciBaslat() {
                let kalanSaniye = SURE_SANIYE;
                clearInterval(sayacAraligi);
                sayaciGuncelle(kalanSaniye);

                sayacAraligi = setInterval(() => {
                    kalanSaniye -= 1;
                    sayaciGuncelle(kalanSaniye);

                    if (kalanSaniye <= 0) {
                        clearInterval(sayacAraligi);
                        eskiHalineDon();
                    }
                }, 1000);
            }

            
            function eskiHalineDon() {
                clearInterval(sayacAraligi);
                abdestMuzik.pause();
                abdestMuzik.currentTime = 0;

                abdestButon.textContent = "ABDEST AL";
                istekli.textContent = "Cenabet gibisin! Abdest Almak için tıklamak ister misin?";
                kediResmi.src = "img/cat.png"; 
                sayaciGuncelle(SURE_SANIYE);

                cerceve.classList.remove('basarili');
                abdestButon.classList.remove('kucul-yok-ol');
                abdestButon.classList.remove('buyu-yerine-gec');
                istekli.classList.remove('baslik-kucul');
                istekli.classList.remove('baslik-buyu');

                document.getElementById('sol-kedi').classList.remove('firlat');
                document.getElementById('sag-kedi').classList.remove('firlat');

                islemTamam = false;
            }

            abdestButon.addEventListener('click', () => {
                if (!islemTamam) {
                    islemTamam = true; 
                    sayaciBaslat();
                    
                    abdestButon.classList.add('kucul-yok-ol');
                    istekli.classList.add('baslik-kucul');
                    
                    setTimeout(() => {
                        
                        abdestButon.textContent = "ABDESTLENDİN";
                        istekli.textContent = "Tebrikler: Artık Cenabet değilsin."; 
                        kediResmi.src = "img/muslimcat.jpeg"; 
                        
                        cerceve.classList.add('basarili');
                        
                        abdestButon.classList.remove('kucul-yok-ol');
                        abdestButon.classList.add('buyu-yerine-gec');
                        
                        istekli.classList.remove('baslik-kucul');
                        istekli.classList.add('baslik-buyu');

                        document.getElementById('sol-kedi').classList.add('firlat');
                        document.getElementById('sag-kedi').classList.add('firlat');
                        
                        // MÜZİĞİ BAŞLAT
                        abdestMuzik.play().catch(error => console.log("Tarayıcı müzik çalmayı engelledi:", error));

                    }, 400); 
                }
            });
        });
    </script>

    
    <script src="java/indexhelper2.js"></script>

    <script>
        fetch('navbar.html') 
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Navbar yüklenirken hata oluştu:', error));
    </script>
     <script src="js/app.js"></script>
</body>
</html>
