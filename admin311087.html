<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - İletişim Güncelle</title>
    
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/yazi.css">

    
    <ul class="arkaplan-daireleri">
        <li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .admin-kutu {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #FFD700;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        h2 {
            color: #FFD700;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .form-grup {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input:focus {
            border-color: #FFD700;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #FFD700;
            color: #111;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e6c200;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .mesaj {
            text-align: center;
            margin-top: 15px;
            color: #00ff00;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>


    <div id="navbar-placeholder"></div>


    <div class="admin-kutu">
        <h2>İletişim Bilgileri Güncelle</h2>
        <div class="form-grup">
            <label>Yeni E-Posta Adresi:</label>
            <input type="email" id="yeni-eposta" placeholder="ornek@gmail.com">
        </div>
        <div class="form-grup">
            <label>Yeni Telefon Numarası:</label>
            <input type="text" id="yeni-telefon" placeholder="+90 5xx xxx xx xx">
        </div>
        <button id="kaydet-btn">Değişiklikleri Kaydet</button>
        <div id="basari-mesaji" class="mesaj">Bilgiler başarıyla güncellendi!</div>
    </div>

    <script>
    
    document.addEventListener('DOMContentLoaded', () => {
        
        // 1. Gerekli HTML elementlerini bul
        const epostaInput = document.getElementById('yeni-eposta');
        const telefonInput = document.getElementById('yeni-telefon');
        const kaydetBtn = document.getElementById('kaydet-btn');
        const mesaj = document.getElementById('basari-mesaji');

        // 2. Sayfa ilk açıldığında hafızada eski kayıt varsa kutulara yazdır
        const mevcutEposta = localStorage.getItem('samed_eposta');
        const mevcutTelefon = localStorage.getItem('samed_telefon');
        
        if (mevcutEposta && epostaInput) epostaInput.value = mevcutEposta;
        if (mevcutTelefon && telefonInput) telefonInput.value = mevcutTelefon;

        // 3. Kaydet butonuna tıklandığında çalışacak olay
        if (kaydetBtn) {
            kaydetBtn.addEventListener('click', (e) => {
                e.preventDefault(); // Sayfanın yanlışlıkla yenilenmesini kesin olarak engeller

                // Girdi kutularındaki güncel metinleri al ve hafızaya (localStorage) kaydet
                if (epostaInput) localStorage.setItem('samed_eposta', epostaInput.value);
                if (telefonInput) localStorage.setItem('samed_telefon', telefonInput.value);

                // Başarı mesajını ekranda göster
                if (mesaj) {
                    mesaj.style.display = 'block';
                    setTimeout(() => {
                        mesaj.style.display = 'none';
                    }, 3000);
                }
                
                });
            }
    });
</script>

    <script>
        fetch('navbar.html') 
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Navbar yüklenirken hata oluştu:', error));
     </script>
</body>
</html>
